<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Why Paper Books Feel Different</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F5F4FA;
      --surface: #FFFFFF;
      --border: #D4CFEA;
      --border-hover: #B0A8D8;
      --text-primary: #16122C;
      --text-secondary: #524B7A;
      --text-hint: #9690BE;
      --accent: #5B47C5;
      --accent-light: #EDEAFC;
      --accent-mid: #7260D8;
      --accent-dark: #3A2BA0;
      --green-bg: #EAF3DE;
      --green-border: #639922;
      --green-text: #27500A;
      --red-bg: #FCEBEB;
      --red-border: #A32D2D;
      --red-text: #501313;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    .page-wrap { max-width: 680px; margin: 0 auto; }

    .quiz-header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }
    .header-eyebrow {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-mid);
      font-weight: 500;
      margin-bottom: 10px;
    }
    .quiz-header h1 {
      font-size: 26px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .quiz-header p { font-size: 14px; color: var(--text-secondary); }
    .video-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 10px 20px;
      border-radius: 99px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(91,71,197,0.35);
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .video-link:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(91,71,197,0.45);
    }
    .video-link .play-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      color: var(--accent);
      font-size: 10px;
      flex-shrink: 0;
    }

    .progress-wrap { margin-bottom: 2rem; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .progress-bar-bg { background: var(--border); border-radius: 99px; height: 5px; }
    .progress-bar-fill { height: 100%; border-radius: 99px; background: var(--accent-mid); transition: width 0.4s ease; }

    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .q-meta {
      font-size: 11px;
      color: var(--text-hint);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 10px;
    }
    .q-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .mc-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-size: 15px;
      color: var(--text-primary);
      background: transparent;
      text-align: left;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }
    .mc-option:hover { background: var(--bg); border-color: var(--border-hover); }
    .mc-option.selected {
      border-color: var(--accent-mid);
      background: var(--accent-light);
      color: var(--accent-dark);
      box-shadow: 0 0 0 2px var(--accent-mid) inset;
    }
    .mc-option.selected .opt-letter { background: var(--accent-mid); color: #fff; border-color: var(--accent-mid); }

    .opt-letter {
      font-size: 11px;
      font-weight: 600;
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .fill-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .fill-input:focus { border-color: var(--accent-mid); box-shadow: 0 0 0 3px rgba(114,96,216,0.12); }

    .nav-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem; }
    .btn-nav {
      padding: 10px 22px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      font-size: 14px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: var(--text-primary);
      transition: background 0.15s;
    }
    .btn-nav:hover:not(:disabled) { background: var(--border); }
    .btn-nav.primary { background: var(--accent-mid); border-color: var(--accent-mid); color: #fff; }
    .btn-nav.primary:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); }
    .btn-nav:disabled { opacity: 0.4; cursor: default; }

    .score-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem 2rem;
      text-align: center;
      display: none;
      margin-bottom: 1.5rem;
    }
    .score-panel.show { display: block; }
    .score-big { font-size: 56px; font-weight: 600; color: var(--accent-mid); line-height: 1; }
    .score-out { font-size: 15px; color: var(--text-secondary); margin-top: 6px; margin-bottom: 1.5rem; }
    .score-badge {
      display: inline-block;
      padding: 7px 18px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 1.75rem;
      background: var(--accent-light);
      color: var(--accent-dark);
      border: 1px solid var(--accent-mid);
    }
    .stats-row { display: flex; gap: 12px; margin-bottom: 1.75rem; }
    .stat-card {
      flex: 1;
      background: var(--bg);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .stat-num { font-size: 24px; font-weight: 600; }
    .stat-lbl { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
    .btn-retry {
      padding: 10px 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      font-size: 14px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: var(--text-primary);
      transition: background 0.15s;
    }
    .btn-retry:hover { background: var(--bg); }

    .summary-panel { display: none; }
    .summary-panel.show { display: block; }
    .summary-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding-left: 2px;
    }
    .summary-item {
      display: flex;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .summary-icon {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      margin-top: 1px;
    }
    .summary-item.correct .summary-icon { background: var(--green-border); color: #fff; }
    .summary-item.wrong .summary-icon { background: var(--red-border); color: #fff; }
    .summary-item.correct { border-color: var(--green-border); }
    .summary-item.wrong { border-color: var(--red-border); }
    .summary-body { flex: 1; }
    .summary-q { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 6px; line-height: 1.5; }
    .summary-a { font-size: 13px; margin-bottom: 3px; }
    .summary-a .lbl { color: var(--text-secondary); }
    .summary-item.correct .summary-a.your-answer b { color: var(--green-text); }
    .summary-item.wrong .summary-a.your-answer b { color: var(--red-text); }
    .summary-a.correct-answer b { color: var(--green-text); }
    .summary-feedback { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }

    .quiz-footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 12px;
      color: var(--text-hint);
    }
    .quiz-footer a { color: var(--accent-mid); font-weight: 500; text-decoration: underline; }
  </style>
</head>
<body>
<div class="page-wrap">

  <div class="quiz-header">
    <div class="header-eyebrow">🧠 Comprehension quiz</div>
    <h1>Why Paper Books Feel Different</h1>
    <p>10 questions · multiple choice &amp; fill in the blank</p>
    <a class="video-link" href="https://www.youtube.com/watch?v=2aakiqrouK8" target="_blank" rel="noopener"><span class="play-icon">▶</span> Watch the video on YouTube</a>
  </div>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-meta">
      <span id="prog-label">Question 1 of 10</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="prog" style="width: 0%"></div>
    </div>
  </div>

  <div id="quiz-body"></div>
  <div class="nav-row" id="nav-row"></div>

  <div class="score-panel" id="score-panel">
    <div class="score-big" id="score-num"></div>
    <div class="score-out">out of 10 questions</div>
    <div class="score-badge" id="score-badge"></div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="s-correct" style="color: #639922"></div>
        <div class="stat-lbl">Correct</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="s-wrong" style="color: #A32D2D"></div>
        <div class="stat-lbl">Wrong</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="s-pct" style="color: #7260D8"></div>
        <div class="stat-lbl">Score</div>
      </div>
    </div>
    <button class="btn-retry" onclick="restart()">↩ Try again</button>
  </div>

  <div class="summary-panel" id="summary-panel">
    <div class="summary-title">Answer summary</div>
    <div id="summary-list"></div>
  </div>

  <div class="quiz-footer">Based on "Why Paper Books Feel Different" · <a href="https://www.youtube.com/watch?v=2aakiqrouK8" target="_blank" rel="noopener">watch on YouTube</a> · For classroom use</div>
</div>

<script>
const questions = [
  {
    type: "mc",
    text: "Which benefit of e-readers does the speaker admit is attractive?",
    options: [
      "They are much cheaper than paper books",
      "They are kinder to your eyes",
      "You can take your whole collection of books wherever you go",
      "They help you finish books more quickly"
    ],
    answer: 2,
    feedback: "The speaker agrees that being able to carry your entire library around with you is very appealing."
  },
  {
    type: "fill",
    text: "The speaker says a paper book has no ________ — nothing pulls your attention away from the words.",
    answer: "distractions",
    accept: ["distractions", "distraction"],
    feedback: "With a paper book there are no fonts, brightness settings or built-in dictionary to pull you away — just you and the words."
  },
  {
    type: "mc",
    text: "Why does the speaker think even a simple e-reader is still a problem?",
    options: [
      "Because it still has a screen",
      "Because it is too heavy to hold",
      "Because the battery runs out too quickly",
      "Because you cannot change the font size"
    ],
    answer: 0,
    feedback: "He accepts that a Kindle is simpler than a tablet, but says it still uses a screen — and that one fact makes a big difference."
  },
  {
    type: "mc",
    text: "According to the speaker, how do our eyes tend to behave when we read on a screen?",
    options: [
      "They close more often because of tiredness",
      "They read every single word very slowly",
      "They focus mainly on pictures rather than text",
      "They skim quickly down the page in an F-shaped pattern"
    ],
    answer: 3,
    feedback: "On screens, our eyes automatically move in an F pattern and skim, because we are used to expecting speed rather than depth."
  },
  {
    type: "fill",
    text: "Remembering where on a page, or how far through a book, you read something is called spatial ________.",
    answer: "memory",
    feedback: "Psychologists call this spatial memory — physical cues like position on the page help us remember what we read."
  },
  {
    type: "mc",
    text: "Which of these is NOT given as a physical detail of reading a paper book?",
    options: [
      "The feel of the paper under your fingers",
      "The sound of quiet background music",
      "The smell of the ink",
      "How heavy and thick the book is"
    ],
    answer: 1,
    feedback: "The speaker mentions the texture, rustling, weight, thickness and smell of a book — but not background music."
  },
  {
    type: "mc",
    text: "What does research suggest happens when these physical cues are missing?",
    options: [
      "Readers read faster and remember more",
      "Nothing changes in how much readers understand",
      "Readers remember fewer details and understand less overall",
      "Readers enjoy the story much more"
    ],
    answer: 2,
    feedback: "Without physical cues, we recall fewer details and our overall reading comprehension drops."
  },
  {
    type: "fill",
    text: "To copy the feel of a real book, many e-reader apps add page-________ animations.",
    answer: "flipping",
    accept: ["flipping", "flip", "turning", "turn"],
    feedback: "E-readers add page-flipping animations, but the speaker says this doesn't work because there are no real pages — it's still a flat surface."
  },
  {
    type: "mc",
    text: "Why does the speaker feel that you don't really own an ebook?",
    options: [
      "Because you can't lend it, give it away or sell it",
      "Because it disappears after a month",
      "Because it costs more than a paper copy",
      "Because you can only read it once"
    ],
    answer: 0,
    feedback: "Even after paying, you only buy access — you can't lend, give away or sell an ebook, so it isn't truly yours."
  },
  {
    type: "mc",
    text: "According to the speaker, what does sharing and lending books help to support?",
    options: [
      "Lower prices in bookshops",
      "Faster reading speeds",
      "Better spelling skills",
      "People's motivation to read"
    ],
    answer: 3,
    feedback: "Research shows the social side of reading — lending and giving books — is an important part of reading motivation."
  }
];

let current = 0;
let answers = new Array(questions.length).fill(null);
let finished = false;

function updateProgress(idx) {
  const pct = Math.round(((idx + 1) / questions.length) * 100);
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('prog-label').textContent = 'Question ' + (idx + 1) + ' of ' + questions.length;
  document.getElementById('prog-pct').textContent = pct + '%';
}

function hasAnswer(idx) {
  const a = answers[idx];
  return a !== null && a !== undefined && String(a).trim() !== '';
}

function renderQuestion(idx) {
  const q = questions[idx];
  const body = document.getElementById('quiz-body');
  const nav = document.getElementById('nav-row');
  updateProgress(idx);

  let html = '<div class="q-card">';
  html += '<div class="q-meta">Question ' + (idx + 1) + ' of ' + questions.length + ' &nbsp;·&nbsp; ' + (q.type === 'mc' ? 'Multiple choice' : 'Fill in the blank') + '</div>';
  html += '<div class="q-text">' + q.text + '</div>';

  if (q.type === 'mc') {
    const letters = ['A','B','C','D'];
    q.options.forEach(function(opt, i) {
      let cls = 'mc-option' + (answers[idx] === i ? ' selected' : '');
      html += '<button class="' + cls + '" onclick="selectMC(' + idx + ',' + i + ')"><span class="opt-letter">' + letters[i] + '</span>' + opt + '</button>';
    });
  } else {
    const val = answers[idx] ? String(answers[idx]).replace(/"/g, '&quot;') : '';
    html += '<input class="fill-input" type="text" placeholder="Type your answer…" value="' + val + '" oninput="typeFill(' + idx + ', this.value)">';
  }

  html += '</div>';
  body.innerHTML = html;

  nav.innerHTML = '';
  if (idx > 0) {
    const bp = document.createElement('button');
    bp.className = 'btn-nav';
    bp.textContent = '← Previous';
    bp.onclick = function() { current--; renderQuestion(current); };
    nav.appendChild(bp);
  }
  const bn = document.createElement('button');
  bn.className = 'btn-nav primary';
  bn.disabled = !hasAnswer(idx);
  if (idx < questions.length - 1) {
    bn.textContent = 'Next →';
    bn.onclick = function() { current++; renderQuestion(current); };
  } else {
    bn.textContent = 'See results';
    bn.onclick = finishQuiz;
  }
  nav.appendChild(bn);
}

function selectMC(idx, i) {
  answers[idx] = i;
  document.querySelectorAll('#quiz-body .mc-option').forEach(function(el, j) {
    el.classList.toggle('selected', j === i);
  });
  const btn = document.querySelector('.nav-row .btn-nav.primary');
  if (btn) btn.disabled = false;
}

function typeFill(idx, val) {
  answers[idx] = val;
  const btn = document.querySelector('.nav-row .btn-nav.primary');
  if (btn) btn.disabled = !hasAnswer(idx);
}

function normalise(str) {
  return String(str || '').toLowerCase().replace(/-/g, ' ').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}

function isCorrectFill(idx) {
  const q = questions[idx];
  const ans = normalise(answers[idx]);
  if (!ans) return false;
  const accepted = q.accept || [q.answer];
  return accepted.some(function(t) {
    const target = normalise(t);
    return ans === target || (' ' + ans + ' ').includes(' ' + target + ' ');
  });
}

function isCorrect(idx) {
  const q = questions[idx];
  if (q.type === 'mc') return answers[idx] === q.answer;
  return isCorrectFill(idx);
}

function finishQuiz() {
  finished = true;
  document.getElementById('quiz-body').style.display = 'none';
  document.getElementById('nav-row').style.display = 'none';
  document.getElementById('progress-wrap').style.display = 'none';

  let correct = 0;
  questions.forEach(function(q, i) { if (isCorrect(i)) correct++; });

  const total = questions.length;
  const pct = Math.round((correct / total) * 100);
  document.getElementById('score-num').textContent = correct + '/' + total;
  document.getElementById('s-correct').textContent = correct;
  document.getElementById('s-wrong').textContent = total - correct;
  document.getElementById('s-pct').textContent = pct + '%';

  let badge = '';
  if (pct >= 90) badge = '🌟 Excellent — great comprehension!';
  else if (pct >= 70) badge = '👍 Good work — solid understanding';
  else if (pct >= 50) badge = '📺 Not bad — watch the video one more time';
  else badge = '🎬 Try rewatching the video and try again';
  document.getElementById('score-badge').textContent = badge;
  document.getElementById('score-panel').classList.add('show');

  const letters = ['A','B','C','D'];
  const list = document.getElementById('summary-list');
  let html = '';
  questions.forEach(function(q, i) {
    const correctFlag = isCorrect(i);
    const yourAnswerText = q.type === 'mc'
      ? (answers[i] !== null ? letters[answers[i]] + '. ' + q.options[answers[i]] : '(no answer)')
      : (hasAnswer(i) ? '"' + answers[i] + '"' : '(no answer)');
    const correctAnswerText = q.type === 'mc' ? letters[q.answer] + '. ' + q.options[q.answer] : q.answer;

    html += '<div class="summary-item ' + (correctFlag ? 'correct' : 'wrong') + '">';
    html += '<div class="summary-icon">' + (correctFlag ? '✓' : '✗') + '</div>';
    html += '<div class="summary-body">';
    html += '<div class="summary-q">Q' + (i + 1) + '. ' + q.text + '</div>';
    html += '<div class="summary-a your-answer"><span class="lbl">Your answer:</span> <b>' + yourAnswerText + '</b></div>';
    if (!correctFlag) {
      html += '<div class="summary-a correct-answer"><span class="lbl">Correct answer:</span> <b>' + correctAnswerText + '</b></div>';
    }
    html += '<div class="summary-feedback">' + q.feedback + '</div>';
    html += '</div></div>';
  });
  list.innerHTML = html;
  document.getElementById('summary-panel').classList.add('show');
}

function restart() {
  answers = new Array(questions.length).fill(null);
  current = 0;
  finished = false;
  document.getElementById('quiz-body').style.display = 'block';
  document.getElementById('nav-row').style.display = 'flex';
  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('score-panel').classList.remove('show');
  document.getElementById('summary-panel').classList.remove('show');
  renderQuestion(0);
}

renderQuestion(0);
</script>
</body>
</html>
